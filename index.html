<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delegate Modern Grounds Model United Nations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & CSS Variables */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #06140e;
      --card-bg: rgba(12, 38, 27, 0.6);
      --accent-green: #10b981;
      --light-green: #34d399;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --text-gold-light: #e2e8f0;
      --text-muted: #94a3b8;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-gold-light);
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .bg-glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--emerald-glow) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      pointer-events: none;
      animation: float 10s infinite alternate ease-in-out;
    }

    .bg-glow-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.15) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      right: -150px;
      border-radius: 50%;
      pointer-events: none;
      animation: float 12s infinite alternate-reverse ease-in-out;
    }

    /* Teaser Container */
    .container {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 900px;
      width: 90%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 30px var(--emerald-glow);
      z-index: 10;
      animation: fadeIn 1.5s ease-out;
    }

    /* Subtitle Tag */
    .badge {
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--light-green);
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(52, 211, 153, 0.3);
      margin-bottom: 1.5rem;
    }

    /* Main Title */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 1px;
      color: #ffffff;
      margin-bottom: 2rem;
      text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    /* Divider Line */
    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--light-green), transparent);
      margin: 0 auto 2rem;
    }

    /* Coming Soon Text */
    .coming-soon {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 300;
      letter-spacing: 6px;
      color: var(--light-green);
      text-transform: uppercase;
      animation: pulse 2.5s infinite ease-in-out;
    }

    /* Optional Footer / Hint */
    .footer-text {
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.7;
        text-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
      }
      50% {
        opacity: 1;
        text-shadow: 0 0 25px rgba(52, 211, 153, 0.8);
      }
    }

    @keyframes float {
      0% {
        transform: translate(0, 0);
      }
      100% {
        transform: translate(30px, 30px);
      }
    }
  </style>
</head>
<body>

  <!-- Glowing Background Effects -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Teaser Box -->
  <div class="container">
    <div class="badge">Diplomacy & Leadership</div>
    
    <h1>Delegate Modern Grounds<br>Model United Nations</h1>
    
    <div class="divider"></div>
    
    <div class="coming-soon">Coming Soon...</div>
  </div>

</body>
</html>
